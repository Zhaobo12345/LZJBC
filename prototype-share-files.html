<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 项目资料</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 1px solid #ddd; border-radius: 20px; overflow: hidden; position: relative; background: white; }
        .status-bar { height: 44px; background: #f8f8f8; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px; }
        .nav-bar { height: 44px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e8e8e8; }
        .back { font-size: 16px; color: #1890FF; cursor: pointer; }
        .title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
        .placeholder { width: 24px; }
        .page-content { height: calc(100% - 88px); overflow-y: auto; background: #f5f5f5; padding: 12px; }
        .file-card { background: white; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
        .file-header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #f0f0f0; gap: 8px; }
        .file-header .icon { font-size: 18px; }
        .file-header .text { font-size: 15px; font-weight: 600; color: #262626; flex: 1; }
        .file-header .count { font-size: 12px; color: #8C8C8C; background: #f5f5f5; padding: 2px 8px; border-radius: 10px; }
        .file-list { padding: 8px 0; }
        .file-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; transition: background 0.2s ease; }
        .file-item:hover { background: #fafafa; }
        .file-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px; }
        .file-icon.pdf { background: linear-gradient(135deg, #FFF1F0 0%, #FFA39E 100%); }
        .file-icon.img { background: linear-gradient(135deg, #E6F7FF 0%, #BAE7FF 100%); }
        .file-icon.doc { background: linear-gradient(135deg, #F6FFED 0%, #B7EB8F 100%); }
        .file-info { flex: 1; }
        .file-name { font-size: 14px; font-weight: 500; color: #262626; margin-bottom: 4px; }
        .file-meta { font-size: 12px; color: #8C8C8C; }
        .file-arrow { color: #8C8C8C; }
        .file-lock { font-size: 12px; color: #8C8C8C; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar"><div class="time">9:41</div><div class="icons">📶 🔋</div></div>
        <div class="nav-bar">
            <div class="back" onclick="window.history.back()">← 返回</div>
            <div class="title">项目资料</div>
            <div class="placeholder"></div>
        </div>
        <div class="page-content">
            <div class="file-card">
                <div class="file-header"><span class="icon">📄</span><span class="text">合同文件</span><span class="count">4份</span></div>
                <div class="file-list">
                    <div class="file-item">
                        <div class="file-icon pdf">📄</div>
                        <div class="file-info"><div class="file-name">水电分包合同.pdf</div><div class="file-meta">2026-01-10 | 2.3MB</div></div>
                        <div class="file-lock">🔒</div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon pdf">📄</div>
                        <div class="file-info"><div class="file-name">泥瓦分包合同.pdf</div><div class="file-meta">2026-01-15 | 1.8MB</div></div>
                        <div class="file-lock">🔒</div>
                    </div>
                </div>
            </div>
            <div class="file-card">
                <div class="file-header"><span class="icon">📐</span><span class="text">设计图纸</span><span class="count">6份</span></div>
                <div class="file-list">
                    <div class="file-item">
                        <div class="file-icon img">🖼️</div>
                        <div class="file-info"><div class="file-name">水电布置图.dwg</div><div class="file-meta">2026-01-05 | 5.2MB</div></div>
                        <div class="file-arrow">→</div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon img">🖼️</div>
                        <div class="file-info"><div class="file-name">平面布置图.dwg</div><div class="file-meta">2026-01-03 | 3.8MB</div></div>
                        <div class="file-arrow">→</div>
                    </div>
                </div>
            </div>
            <div class="file-card">
                <div class="file-header"><span class="icon">📋</span><span class="text">施工方案</span><span class="count">2份</span></div>
                <div class="file-list">
                    <div class="file-item">
                        <div class="file-icon doc">📝</div>
                        <div class="file-info"><div class="file-name">水电施工方案.docx</div><div class="file-meta">2026-01-08 | 1.2MB</div></div>
                        <div class="file-arrow">→</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="page-nav">
        <div class="page-nav-title">分享功能导航</div>
        <a href="share-navigation.html" class="page-nav-item">导航首页</a>
        <a href="prototype-share-receive.html" class="page-nav-item">项目详情分享</a>
        <a href="prototype-share-project-info.html" class="page-nav-item">项目信息</a>
        <a href="prototype-share-architecture.html" class="page-nav-item">项目架构</a>
        <a href="prototype-share-members.html" class="page-nav-item">项目成员</a>
        <a href="prototype-share-files.html" class="page-nav-item active">项目资料</a>
        <a href="prototype-share-receive-activity.html" class="page-nav-item">项目动态分享</a>
        <a href="prototype-share-receive-task.html" class="page-nav-item">项目任务分享</a>
        <a href="prototype-share-receive-task-detail.html" class="page-nav-item">任务详情分享</a>
        <a href="prototype-share-receive-contract-list.html" class="page-nav-item">项目合同列表</a>
        <a href="prototype-share-receive-contract-detail.html" class="page-nav-item">项目合同详情</a>
        <a href="prototype-join-request.html" class="page-nav-item">申请加入页</a>
    </div>
    <script src="common.js"></script>
</body>
</html>
