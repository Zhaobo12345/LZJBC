<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 项目信息</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 1px solid #ddd; border-radius: 20px; overflow: hidden; position: relative; background: white; }
        .status-bar { height: 44px; background: #f8f8f8; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px; }
        .nav-bar { height: 44px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e8e8e8; }
        .back { font-size: 16px; color: #1890FF; cursor: pointer; }
        .title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
        .placeholder { width: 24px; }
        .page-content { height: calc(100% - 88px); overflow-y: auto; background: #f5f5f5; padding: 12px; }
        .section-card { background: white; border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section-header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #f0f0f0; gap: 8px; }
        .section-header .icon { font-size: 18px; }
        .section-header .text { font-size: 15px; font-weight: 600; color: #262626; }
        .info-list { padding: 16px; }
        .info-item { display: flex; margin-bottom: 12px; font-size: 14px; }
        .info-item:last-child { margin-bottom: 0; }
        .info-item .label { width: 80px; color: #8C8C8C; flex-shrink: 0; }
        .info-item .value { flex: 1; color: #262626; }
        .info-item .encrypted { color: #8C8C8C; }
        .info-item .lock { margin-left: 4px; color: #8C8C8C; }
        .status-tag { display: inline-flex; align-items: center; background: #E6F7FF; color: #1890FF; padding: 2px 8px; border-radius: 4px; font-size: 12px; gap: 4px; }
        .status-tag .dot { width: 6px; height: 6px; background: #52C41A; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar"><div class="time">9:41</div><div class="icons">📶 🔋</div></div>
        <div class="nav-bar">
            <div class="back" onclick="window.history.back()">← 返回</div>
            <div class="title">项目信息</div>
            <div class="placeholder"></div>
        </div>
        <div class="page-content">
            <div class="section-card">
                <div class="section-header"><span class="icon">🏠</span><span class="text">基本信息</span></div>
                <div class="info-list">
                    <div class="info-item"><div class="label">项目名称</div><div class="value">XX小区整体装修</div></div>
                    <div class="info-item"><div class="label">项目状态</div><div class="value"><span class="status-tag"><span class="dot"></span>水电阶段 · 进行中</span></div></div>
                    <div class="info-item"><div class="label">项目地址</div><div class="value">广东省深圳市***区 <span class="encrypted">*************</span> <span class="lock">🔒</span></div></div>
                    <div class="info-item"><div class="label">创建时间</div><div class="value">2026-01-05</div></div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-header"><span class="icon">📋</span><span class="text">客户信息</span></div>
                <div class="info-list">
                    <div class="info-item"><div class="label">客户姓名</div><div class="value">张先生</div></div>
                    <div class="info-item"><div class="label">房屋面积</div><div class="value">120㎡</div></div>
                    <div class="info-item"><div class="label">房屋类型</div><div class="value">平层</div></div>
                    <div class="info-item"><div class="label">装修风格</div><div class="value">现代简约</div></div>
                    <div class="info-item"><div class="label">联系方式</div><div class="value encrypted">138****8888 <span class="lock">🔒</span></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="page-nav">
        <div class="page-nav-title">分享功能导航</div>
        <a href="share-navigation.html" class="page-nav-item">导航首页</a>
        <a href="prototype-share-receive.html" class="page-nav-item">项目详情分享</a>
        <a href="prototype-share-project-info.html" class="page-nav-item active">项目信息</a>
        <a href="prototype-share-architecture.html" class="page-nav-item">项目架构</a>
        <a href="prototype-share-members.html" class="page-nav-item">项目成员</a>
        <a href="prototype-share-files.html" class="page-nav-item">项目资料</a>
        <a href="prototype-share-receive-activity.html" class="page-nav-item">项目动态分享</a>
        <a href="prototype-share-receive-task.html" class="page-nav-item">项目任务分享</a>
        <a href="prototype-share-receive-task-detail.html" class="page-nav-item">任务详情分享</a>
        <a href="prototype-share-receive-contract-list.html" class="page-nav-item">项目合同列表</a>
        <a href="prototype-share-receive-contract-detail.html" class="page-nav-item">项目合同详情</a>
        <a href="prototype-join-request.html" class="page-nav-item">申请加入页</a>
    </div>
    <script src="common.js"></script>
</body>
</html>
