<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 项目成员</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 1px solid #ddd; border-radius: 20px; overflow: hidden; position: relative; background: white; }
        .status-bar { height: 44px; background: #f8f8f8; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px; }
        .nav-bar { height: 44px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e8e8e8; }
        .back { font-size: 16px; color: #1890FF; cursor: pointer; }
        .title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
        .placeholder { width: 24px; }
        .page-content { height: calc(100% - 88px); overflow-y: auto; background: #f5f5f5; padding: 12px; }
        .member-card { background: white; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
        .member-header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #f0f0f0; gap: 8px; }
        .member-header .icon { font-size: 18px; }
        .member-header .text { font-size: 15px; font-weight: 600; color: #262626; flex: 1; }
        .member-header .count { font-size: 12px; color: #8C8C8C; background: #f5f5f5; padding: 2px 8px; border-radius: 10px; }
        .member-list { padding: 8px 0; }
        .member-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; transition: background 0.2s ease; }
        .member-item:hover { background: #fafafa; }
        .member-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: white; margin-right: 12px; }
        .member-avatar.blue { background: linear-gradient(135deg, #1890FF 0%, #096DD9 100%); }
        .member-avatar.green { background: linear-gradient(135deg, #52C41A 0%, #389E0D 100%); }
        .member-avatar.orange { background: linear-gradient(135deg, #FA8C16 0%, #D46B08 100%); }
        .member-avatar.purple { background: linear-gradient(135deg, #722ED1 0%, #531DAB 100%); }
        .member-info { flex: 1; }
        .member-name { font-size: 14px; font-weight: 500; color: #262626; margin-bottom: 4px; }
        .member-role { font-size: 12px; color: #8C8C8C; }
        .member-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #E6F7FF; color: #1890FF; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar"><div class="time">9:41</div><div class="icons">📶 🔋</div></div>
        <div class="nav-bar">
            <div class="back" onclick="window.history.back()">← 返回</div>
            <div class="title">项目成员</div>
            <div class="placeholder"></div>
        </div>
        <div class="page-content">
            <div class="member-card">
                <div class="member-header"><span class="icon">👔</span><span class="text">管理层</span><span class="count">2人</span></div>
                <div class="member-list">
                    <div class="member-item">
                        <div class="member-avatar blue">李</div>
                        <div class="member-info"><div class="member-name">李工</div><div class="member-role">项目经理</div></div>
                        <div class="member-tag">负责人</div>
                    </div>
                    <div class="member-item">
                        <div class="member-avatar green">张</div>
                        <div class="member-info"><div class="member-name">张经理</div><div class="member-role">项目总监</div></div>
                    </div>
                </div>
            </div>
            <div class="member-card">
                <div class="member-header"><span class="icon">⚡</span><span class="text">水电组</span><span class="count">3人</span></div>
                <div class="member-list">
                    <div class="member-item">
                        <div class="member-avatar orange">王</div>
                        <div class="member-info"><div class="member-name">王师傅</div><div class="member-role">组长</div></div>
                        <div class="member-tag">组长</div>
                    </div>
                    <div class="member-item">
                        <div class="member-avatar blue">刘</div>
                        <div class="member-info"><div class="member-name">刘师傅</div><div class="member-role">水电工</div></div>
                    </div>
                    <div class="member-item">
                        <div class="member-avatar green">陈</div>
                        <div class="member-info"><div class="member-name">陈师傅</div><div class="member-role">水电工</div></div>
                    </div>
                </div>
            </div>
            <div class="member-card">
                <div class="member-header"><span class="icon">🧱</span><span class="text">泥瓦组</span><span class="count">2人</span></div>
                <div class="member-list">
                    <div class="member-item">
                        <div class="member-avatar purple">赵</div>
                        <div class="member-info"><div class="member-name">赵师傅</div><div class="member-role">组长</div></div>
                        <div class="member-tag">组长</div>
                    </div>
                    <div class="member-item">
                        <div class="member-avatar orange">钱</div>
                        <div class="member-info"><div class="member-name">钱师傅</div><div class="member-role">泥瓦工</div></div>
                    </div>
                </div>
            </div>
            <div class="member-card">
                <div class="member-header"><span class="icon">🪚</span><span class="text">木工组</span><span class="count">1人</span></div>
                <div class="member-list">
                    <div class="member-item">
                        <div class="member-avatar blue">孙</div>
                        <div class="member-info"><div class="member-name">孙师傅</div><div class="member-role">木工</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <div class="page-nav-title">分享功能导航</div>

        <a href="prototype-share-files.html" class="page-nav-item">项目资料</a>
        <a href="prototype-share-receive-activity.html" class="page-nav-item">项目动态分享</a>
        <a href="prototype-share-receive-task.html" class="page-nav-item">项目任务分享</a>
        <a href="prototype-share-receive-task-detail.html" class="page-nav-item">任务详情分享</a>
        <a href="prototype-share-receive-contract-list.html" class="page-nav-item">项目合同列表</a>

        <a href="prototype-join-request.html" class="page-nav-item">申请加入页</a>

    <script src="common.js"></script>
</body>
</html>
